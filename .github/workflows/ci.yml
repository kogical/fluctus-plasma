name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: just ci (Rust + C++ Release + ASan/UBSan + lint)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --security-opt seccomp=unconfined

    env:
      CC: clang
      CXX: clang++
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_ctime,include_file_mtime
      ASAN_OPTIONS: detect_leaks=0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: arch-pacman-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: arch-pacman-

      - name: Cache ccache, CMake trees and Cargo
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            .cargo-home/registry
            .cargo-home/git
            target
            build/release
            build/debug-asan-ubsan
          key: arch-build-${{ hashFiles('**/CMakeLists.txt', 'CMakePresets.json', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            arch-build-${{ hashFiles('**/CMakeLists.txt', 'CMakePresets.json', 'Cargo.lock') }}-
            arch-build-

      - name: Install KDE Plasma 6, Qt 6 and the toolchain
        run: |
          mkdir -p /var/cache/pacman/pkg
          pacman -Syu --noconfirm --needed \
            just cmake ninja ccache lld clang rust \
            extra-cmake-modules qt6-base qt6-declarative qt6-shadertools \
            kconfig kcoreaddons kguiaddons ki18n kwindowsystem kglobalaccel kservice kio kcmutils \
            libplasma plasma-workspace kwin kdecoration

      - name: Zero ccache stats
        run: ccache -z

      - name: just ci
        run: just ci

      - name: Print ccache statistics
        if: always()
        run: ccache -s

      - name: Upload compiled plugins
        uses: actions/upload-artifact@v4
        with:
          name: fluctus-plugins-linux-x86_64
          path: |
            build/release/bin/plasma/applets/com.kogical.fluctus.dock.so
            build/release/bin/fluctusglass.so
            build/release/bin/kwin_fluctusglass_config.so
          retention-days: 14
