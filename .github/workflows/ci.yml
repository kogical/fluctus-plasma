name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build, Test (Release + ASan/UBSan) & clang-tidy
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --security-opt seccomp=unconfined

    env:
      CC: clang
      CXX: clang++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_ctime,include_file_mtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: arch-pacman-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            arch-pacman-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: arch-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ github.sha }}
          restore-keys: |
            arch-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-
            arch-ccache-

      - name: Cache Ninja build trees
        uses: actions/cache@v4
        with:
          path: |
            build/release
            build/debug-asan-ubsan
          key: arch-build-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ github.sha }}
          restore-keys: |
            arch-build-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-

      - name: Install KDE Plasma 6, Qt 6, and build toolchain
        run: |
          mkdir -p /var/cache/pacman/pkg
          pacman -Syu --noconfirm --needed \
            cmake \
            ninja \
            ccache \
            lld \
            clang \
            extra-cmake-modules \
            qt6-base \
            qt6-declarative \
            qt6-shadertools \
            kconfig \
            kcoreaddons \
            ki18n \
            kwindowsystem \
            kglobalaccel \
            kservice \
            kio \
            libplasma \
            plasma-workspace

      - name: Zero ccache stats
        run: ccache -z

      - name: Configure & build (Release)
        run: |
          cmake --preset release -DFLUCTUS_REQUIRE_ECM=ON
          cmake --build --preset release --parallel "$(nproc)"

      - name: Run unit tests (Release)
        run: ctest --preset release --output-on-failure

      - name: Configure & build (Debug + ASan/UBSan)
        run: |
          cmake --preset debug-asan-ubsan -DFLUCTUS_REQUIRE_ECM=ON
          cmake --build --preset debug-asan-ubsan --parallel "$(nproc)"

      - name: Run unit tests (Debug + ASan/UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --preset debug-asan-ubsan --output-on-failure

      - name: Run clang-tidy on C++23 sources
        run: |
          find src -name '*.cpp' -print0 | xargs -0 -n1 -P "$(nproc)" \
            clang-tidy -p build/release --quiet

      - name: Print ccache statistics
        if: always()
        run: ccache -s

      - name: Upload compiled applet artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluctus-applet-linux-x86_64
          path: build/release/bin/plasma/applets/com.kogical.fluctus.so
          retention-days: 14
